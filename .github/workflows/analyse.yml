name: Analyse des photos de chats (Kaggle GPU)
on:
  schedule:
    - cron: "17 3,9,15,21 * * *"     # 4 fois par jour (UTC) : 22 h 17, 4 h 17, 10 h 17, 16 h 17 à Montréal
  workflow_dispatch: {}
concurrency:
  group: analyse
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BERCAIL_URL: ${{ vars.BERCAIL_URL || 'https://app.bercail.online' }}
      BERCAIL_VISION_TOKEN: ${{ secrets.BERCAIL_VISION_TOKEN }}
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}   # jeton KGAT_ (nouveau format)
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}               # ancien format, facultatif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: File d'attente
        id: prep
        run: python scripts/prepare.py
      - name: Lancer le notebook Kaggle (GPU T4)
        if: steps.prep.outputs.rien == '0'
        run: |
          pip install -q "kaggle>=1.8" six
          kaggle kernels push -p build
      - name: Attendre la fin
        if: steps.prep.outputs.rien == '0'
        run: |
          K="$KAGGLE_USERNAME/bercail-vision"
          VU=0   # juste après le push, « status » peut encore montrer la version précédente (déjà terminée)
          for i in $(seq 1 300); do
            S=$(kaggle kernels status "$K" 2>&1 | tr -d '\n')
            case "$S" in
              *queued*|*QUEUED*|*running*|*RUNNING*) VU=1;;
              *complete*|*COMPLETE*) if [ "$VU" = 1 ] || [ "$i" -gt 5 ]; then echo "terminé"; exit 0; fi;;
              *error*|*ERROR*|*cancel*|*CANCEL*) if [ "$VU" = 1 ] || [ "$i" -gt 5 ]; then echo "$S"; exit 1; fi;;
            esac
            sleep 60
          done
          echo "trop long"; exit 1
      - name: Récupérer et renvoyer les résultats
        if: always() && steps.prep.outputs.rien == '0'
        run: |
          mkdir -p out
          kaggle kernels output "$KAGGLE_USERNAME/bercail-vision" -p out > /dev/null || true
          python scripts/post_results.py out/results.jsonl
